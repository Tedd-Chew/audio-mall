# 双实例的反向代理配置
#
# 用法（在 audiobackend 目录下）：
#   docker run -d --name audio-mall-nginx -p 8000:80 nginx:alpine
#   docker cp loadtest/nginx.conf audio-mall-nginx:/etc/nginx/nginx.conf
#   docker exec audio-mall-nginx nginx -t
#   docker exec audio-mall-nginx nginx -s reload
#
# 为什么用 docker cp 而不是 -v 挂载：仓库路径里有中文（D:\桌面\...），
# 挂载在 Docker Desktop 上不稳定；docker cp 没有这个问题，代价是改配置要重新 copy 一次。

worker_processes 1;

events {
    worker_connections 4096;
}

http {
    # 访问日志里带上真正接手的实例和它的耗时 —— 验证"请求被分到两个实例"就靠这一列，
    # 不需要应用改任何代码去返回实例标识
    log_format main '$remote_addr "$request" $status '
                    'upstream=$upstream_addr '
                    'upstream_time=$upstream_response_time '
                    'total=$request_time';
    access_log /var/log/nginx/access.log main;

    # Docker 内置 DNS 在容器里的地址，负责解析名字。
    #
    # 为什么不是 127.0.0.11：那是 Linux 上 Docker 内置解析器的地址；Docker Desktop
    # （Windows/Mac）里 `/etc/resolv.conf` 写的是 192.168.65.7，用 127.0.0.11 会得到
    # `recv() failed (111: Connection refused) while resolving`，所有请求直接 502。
    # 换机器前先看一眼：docker exec <容器> cat /etc/resolv.conf
    #
    # ipv6=off 不是可选项：本机的 host.docker.internal 同时有 IPv6（fdc4:f303:9324::254）
    # 和 IPv4（192.168.65.254），而 IPv6 在这个容器里不可达。不关的话实测
    # 10 个请求里有 2 个 502（error.log 里是 "connect() ... (101: Network unreachable)"）。
    resolver 192.168.65.7 valid=10s ipv6=off;

    upstream audio_app {
        # resolve + zone：让 nginx 定期重新解析名字，而不是只在启动时解析一次。
        # 好处是 Docker 重启后宿主地址变了也能自己跟上，不用改配置
        zone audio_app 64k;

        # host.docker.internal 是 Docker Desktop 提供的"宿主机"域名，
        # 容器内用它访问跑在 Windows 上的 8080 / 8081
        server host.docker.internal:8080 resolve max_fails=3 fail_timeout=5s;
        server host.docker.internal:8081 resolve max_fails=3 fail_timeout=5s;

        # 保持到上游的长连接。不开的话每个请求都要重新握手，
        # 压测时这一项能差出好几毫秒
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # 和应用的 upload 限制对齐（application.yml 里 max-request-size: 50MB）
        client_max_body_size 50m;

        location / {
            proxy_pass http://audio_app;

            # 这三行是 upstream keepalive 生效的前提：默认是 HTTP/1.0 且 Connection: close
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时。nginx 默认 proxy_read_timeout 是 60 秒 ——
            # 和 Redis 那次踩的坑是同一个（默认值太长，故障时挂一分钟）。
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # 一个实例挂了（连接错误 / 超时 / 502 / 503）自动换下一个重试。
            # 这就是"高可用"在配置层面的落地
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
