<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>登录 - Musilab Audio</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="fontawesome-5.5/css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/raleway.css" />
    <link rel="stylesheet" href="css/tooplate-infinite-loop.css" />
    <link rel="stylesheet" href="css/musilab-theme.css" />
    <link rel="stylesheet" href="css/musilab-admin.css" />
  </head>
  <body>
    <section class="tm-parallax" style="height: 100vh;">
      <div class="login-container admin-card" style="max-width: 420px; margin: 100px auto; padding: 40px;">
        <img src="logo.svg" alt="Musilab Audio" class="brand-logo d-block mx-auto" style="width: 64px; height: 64px;" />
        <h2 class="text-center mb-4" style="color: var(--admin-accent);">管理员登录</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;">登录</button>
          <div id="errorMessage" style="color: var(--admin-danger); text-align: center; margin-top: 15px;"></div>
        </form>
        <a href="/en" class="d-block text-center mt-4" style="color: var(--admin-accent); text-decoration: none;">返回首页</a>
      </div>
    </section>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
      $(function() {
        $('#loginForm').submit(function(e) {
          e.preventDefault();
          
          var username = $('#username').val();
          var password = $('#password').val();
          
          $.ajax({
            url: '/api/user/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username: username, password: password }),
            success: function(response) {
              if (response.code === 200) {
                localStorage.setItem('token', response.data);
                localStorage.setItem('loggedIn', 'true');
                window.location.href = 'admin.html';
              } else {
                $('#errorMessage').text(response.message);
              }
            },
            error: function() {
              $('#errorMessage').text('登录失败，请稍后重试');
            }
          });
        });
      });
    </script>
  </body>
</html>
