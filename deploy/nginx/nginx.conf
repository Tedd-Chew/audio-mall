# audio-mall 生产环境 Nginx
#
# 容器用 network_mode: host：这样 Nginx 直接监听宿主机 80，
# 而 "127.0.0.1:8080" 就是宿主机的应用进程，不需要 host.docker.internal 那套
# 特殊 DNS（本地 Windows 上踩过：Docker Desktop 把 host.docker.internal 解析成
# IPv6 的不通地址，导致 502）。

worker_processes  1;          # 1 vCPU 级别够用，多开反而抢内存
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 上传接口最大 50MB（和 spring.servlet.multipart.max-request-size 对齐）
    client_max_body_size 50m;

    # access log 带上游耗时，排障时能一眼看出慢在 Nginx 还是慢在应用
    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time upstream=$upstream_addr ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    upstream audio_app {
        server 127.0.0.1:8080;
        keepalive 32;             # 复用到后端的长连接，避免每个请求都三次握手
    }

    server {
        listen 80;
        server_name _;

        # 健康检查不记日志，否则监控一刷就把 access log 冲掉
        location = /health {
            access_log off;
            proxy_pass http://audio_app/api/product/1;
        }

        location / {
            proxy_pass http://audio_app;
            proxy_http_version 1.1;
            # keepalive 要求：不显式清空 Connection，Nginx 会给上游发 close
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 应用侧 Redis 1s、MySQL 5s 就超时了，Nginx 留 10s 足够兜住
            proxy_connect_timeout 2s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}
